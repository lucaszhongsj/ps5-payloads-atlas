name: ps5-payloads-atlas

# A one-way pipeline; each step consumes the previous step's product and no
# work is done twice:
#   collect  upstream lists → sources/mirror/*.json (writes the sources/mirror/*.json only)
#   build    sources/ → payloads.json               (observes release state over the network)
#   render   payloads.json → the README `Payloads` table
#   site     README.md & payloads.json → _site/ → Pages
on:
  schedule:
    - cron: '10 */6 * * *' # every 6 hours. ( 08:10 / 14:10 / 20:10 / 02:10 in UTC+8 )
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ps5-payloads-atlas
  # Queue runs instead of killing one mid-flight: a cancelled run may already
  # have pushed, which leaves the next run building on a stale head_sha.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # Re-runs reuse the original run's head_sha. Resolve main at checkout
          # time so a re-run never starts from a commit main has moved past.
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      # 1) Collect: writes sources/mirror/ only; manual/ is never touched, and a failed fetch keeps the old snapshot.
      - name: Collect upstream lists
        run: python scripts/atlas.py collect

      # 2) Assemble: watch each repo's latest release, then shape the client catalogue from those observations.
      - name: Assemble catalogue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/atlas.py build

      # 3) Render: a pure view; the README moves only when payloads.json did.
      - name: Render README `Payloads`
        run: python scripts/atlas.py render

      # 4) Commit + Push: rebuild the generated commit on the current main tip.
      #    These files are full snapshots, not diffs, so rebasing the old commit
      #    would fight with the previous auto-commit. Overwrite, never merge.
      - name: Commit and push changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage once to learn exactly which generated files this run touched.
          git add -A -- payloads.json README.md sources/
          if git diff --cached --quiet; then
            echo "No changes to publish"
            exit 0
          fi

          artefacts="${RUNNER_TEMP:?}/atlas-artefacts"
          deleted="${RUNNER_TEMP:?}/atlas-deleted"
          rm -rf "$artefacts" "$deleted"
          mkdir -p "$artefacts"
          git diff --cached --name-only -z | while IFS= read -r -d '' file; do
            if [ -f "$file" ]; then
              mkdir -p "$artefacts/$(dirname "$file")"
              cp -a "$file" "$artefacts/$file"
            fi
          done
          git diff --cached --diff-filter=D --name-only -z > "$deleted"

          # Rebase point is the latest remote main. The whole cycle repeats if
          # main advances again between fetch and push.
          for attempt in 1 2 3; do
            git fetch --no-tags origin main
            git reset --hard FETCH_HEAD
            cp -a "$artefacts/." .
            while IFS= read -r -d '' file; do
              rm -f -- "$file"
            done < "$deleted"
            git add -A -- payloads.json README.md sources/
            if git diff --cached --quiet; then
              echo "No changes to publish on current main"
              exit 0
            fi
            git commit -m "chore: refresh catalogue"
            if git push origin HEAD:main; then
              echo "Published $(git rev-parse --short HEAD)"
              exit 0
            fi
            echo "::warning::Push rejected (main moved); retry $attempt/3"
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 2)); fi
          done
          echo "::error::Could not push after 3 attempts"
          exit 1

      # 5) Package + publish. The worktree already holds the pushed content, so the Pages deployment needs no second checkout or runner.
      - name: Package site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/atlas.py site

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  # Deployed from its own job on purpose. The run's artifact list is eventually
  # consistent, so a lookup in the same job can come back empty right after
  # upload (actions/deploy-pages#451). A separate job starts seconds later;
  # more importantly, a failed deploy can be re-run alone, whereas re-running
  # the build job would upload a second `github-pages` artifact and then fail
  # with "Multiple artifacts named".
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
